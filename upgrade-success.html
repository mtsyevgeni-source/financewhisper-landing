<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Premium — FinanceWhisper</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #0b0f14;
    --bg-card: #121821;
    --border: #212b38;
    --text: #e8edf4;
    --text-dim: #93a1b3;
    --accent: #4fa3ff;
    --green: #4fd48a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px; text-align: center; }
  .check {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(79, 212, 138, 0.12);
    color: var(--green);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  h1 { font-size: 26px; margin: 0 0 12px; }
  p { color: var(--text-dim); font-size: 15px; margin: 0 0 28px; }
  .cta {
    display: inline-block;
    background: var(--accent);
    color: #06121f;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 15px;
  }
  .cta:hover { background: #6bb3ff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="check">&#10003;</div>
    <h1>Payment received</h1>
    <p>Your FinanceWhisper Premium is activating now — it usually takes under a
      minute. Head back to the bot and you'll see it unlock automatically.</p>
    <a class="cta" href="https://t.me/FinanceWhisper_bot" target="_blank" rel="noopener">Back to the bot</a>
  </div>
</body>
</html>
